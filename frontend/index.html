<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SchemeSathi AI — Discover Benefits. Understand Eligibility. Apply with Confidence.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      /* Hide Google Translate top banner, toolbars, "Rate this translation" floating widgets */
      .goog-te-banner-frame,
      .goog-te-balloon-frame,
      #goog-gt-tt,
      #goog-gt-voting,
      .goog-tooltip,
      .goog-tooltip:hover,
      .goog-text-highlight,
      div[id*="goog-gt-"],
      div[class*="VIpgJd"],
      .VIpgJd-ZVi9od-aZ2wEe-wOHMyf,
      .VIpgJd-yAWNEb-L7lbkb,
      iframe.goog-te-banner-frame,
      iframe.skiptranslate,
      .skiptranslate iframe {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }

      body {
        top: 0px !important;
        position: static !important;
      }

      #google_translate_element {
        display: none !important;
      }
    </style>
  </head>
  <body class="bg-alabaster text-charcoal antialiased">
    <div id="root"></div>

    <!-- Hidden Google Translate Element for Auto-Switcher -->
    <div id="google_translate_element" style="display: none;"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'en',
          includedLanguages: 'en,hi,mr',
          autoDisplay: false
        }, 'google_translate_element');
      }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
